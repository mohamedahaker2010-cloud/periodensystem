<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawi Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #0a0d1a;
            --bg2: #131834;
            --card-bg: #12162a;
            --card-bg-2: #171d38;
            --accent: #2bc4a0;
            --accent-soft: rgba(43, 196, 160, 0.18);
            --amber: #f2b656;
            --electron: #56c9e8;
            --text: #eef0f8;
            --muted: #8891ab;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% -10%, #1c2452, var(--bg1) 65%);
            color: var(--text);
            font-family: 'Exo 2', 'Segoe UI', Arial, sans-serif;
            padding: 15px;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 6px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 18px rgba(43, 196, 160, 0.35);
        }
        .subtitle {
            color: var(--muted);
            font-size: 12.5px;
            margin-bottom: 16px;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.3px;
        }

        .table-wrapper {
            overflow-x: auto;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 48px);
            gap: 3px;
            justify-content: start;
            width: fit-content;
            margin: 0 auto;
        }

        .element {
            background: linear-gradient(160deg, #1a2040, #10142a);
            border: 1.5px solid var(--accent);
            border-radius: 8px;
            width: 48px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            transition: 0.18s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.04) inset;
        }
        .element:active {
            transform: scale(0.95);
            box-shadow: 0 1px 2px rgba(0,0,0,0.4) inset;
        }
        .element:hover {
            transform: translateY(-2px) scale(1.1);
            z-index: 5;
            box-shadow: 0 10px 22px rgba(0,0,0,0.45), 0 0 16px var(--accent-soft);
            border-color: #5eead4;
        }

        .atomic-number { font-size: 8px; color: var(--muted); font-family: 'Roboto Mono', monospace; }
        .symbol { font-size: 15px; font-weight: 800; color: var(--accent); font-family: 'Exo 2', sans-serif; }
        .name { font-size: 5px; color: #b7bcd6; }

        .empty { width: 48px; height: 48px; }

        .info-card {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(160deg, var(--card-bg), var(--card-bg-2));
            border: 1px solid var(--accent-soft);
            border-radius: 14px;
            padding: 22px;
            z-index: 100;
            width: 92%;
            max-width: 580px;
            max-height: 85vh;
            overflow-y: auto;
            overflow-x: visible;
            text-align: right;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(34,211,170,0.08);
        }
        .info-card.active { display: block; }
        .close-btn {
            position: absolute; top: 10px; right: 12px;
            background: rgba(255,255,255,0.05); border: none; color: var(--text);
            font-size: 16px; cursor: pointer; width: 26px; height: 26px; border-radius: 50%;
            transition: 0.15s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.12); }

        .info-card h2 { color: var(--accent); margin-bottom: 14px; text-align: center; font-size: 22px; font-weight: 800; text-shadow: 0 0 14px rgba(43, 196, 160, 0.3); }

        .card-body {
            display: flex;
            flex-direction: row-reverse;
            gap: 18px;
            align-items: flex-start;
        }

        .card-visual {
            flex: 0 0 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .card-info {
            flex: 1;
            min-width: 0;
            text-align: right;
        }

        .element-image {
            width: 110px;
            height: 110px;
            border-radius: 12px;
            border: 1px solid var(--accent-soft);
            background: linear-gradient(150deg, #1c2242, #10142a);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 38px;
            font-weight: bold;
            color: rgba(34, 211, 170, 0.45);
        }
        .element-image img { width: 100%; height: 100%; object-fit: cover; }

        .info-card p { margin: 6px 0; font-size: 13.5px; color: #d3d7ea; }
        .info-card p b, .info-card p strong { color: var(--text); }

        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
        .nav-buttons button, .atom-btn {
            background: linear-gradient(135deg, var(--accent), #1a8f9e);
            color: #06231c;
            border: none;
            border-radius: 20px;
            padding: 7px 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12.5px;
            font-family: 'Exo 2', sans-serif;
            transition: 0.2s ease;
            box-shadow: 0 4px 14px rgba(43, 196, 160, 0.25);
        }
        .nav-buttons button:hover, .atom-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(43, 196, 160, 0.4);
            background: linear-gradient(135deg, #fff, var(--accent));
        }
        .atom-btn { margin: 0; }

        /* --- Atom stage: canvas + annotation tooltip --- */
        .atom-stage {
            position: relative;
            width: 240px;
            height: 210px;
            display: none;
        }
        .atom-stage.active { display: block; }

        #atom-canvas {
            position: absolute;
            left: 0;
            top: 40px;
            width: 170px;
            height: 170px;
            background-color: #0d1128;
            border: 1px solid var(--accent-soft);
            border-radius: 10px;
            cursor: pointer;
        }

        #nucleus-line-svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 240px;
            height: 210px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #nucleus-line-svg.active { opacity: 1; }

        #nucleus-tooltip {
            position: absolute;
            left: 95px;
            top: 0px;
            width: 140px;
            background: #1a2040;
            border: 1px solid var(--accent);
            border-radius: 9px;
            padding: 8px 10px;
            font-size: 11.5px;
            text-align: right;
            opacity: 0;
            transform: scale(0.85);
            transform-origin: bottom left;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            box-shadow: 0 8px 22px rgba(0,0,0,0.5);
        }
        #nucleus-tooltip.active { opacity: 1; transform: scale(1); }

        .tip-row { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin: 4px 0; white-space: nowrap; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .dot-proton { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
        .dot-neutron { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

        .hint { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

        /* --- Fun facts full-screen page --- */
        #facts-page {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: radial-gradient(circle at 20% 0%, var(--bg2), var(--bg1) 65%);
            overflow-y: auto;
            padding: 18px 16px 40px;
        }
        #facts-page.active { display: block; }

        .facts-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
        }
        .facts-back {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--accent-soft);
            color: var(--text);
            border-radius: 20px;
            padding: 7px 16px;
            font-size: 12.5px;
            font-family: 'Exo 2', sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s ease;
        }
        .facts-back:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }

        .facts-title { display: flex; align-items: center; gap: 10px; }
        .facts-title #facts-symbol {
            font-size: 26px;
            font-weight: 800;
            font-family: 'Exo 2', sans-serif;
            color: var(--accent);
            background: rgba(43,196,160,0.12);
            border: 1px solid var(--accent-soft);
            border-radius: 8px;
            padding: 2px 10px;
            text-shadow: 0 0 10px rgba(43,196,160,0.3);
        }
        .facts-title h2 { color: var(--text); font-size: 19px; font-weight: 700; }

        .facts-list {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .fact-card {
            background: linear-gradient(150deg, var(--card-bg), var(--card-bg-2));
            border: 1px solid var(--accent-soft);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            text-align: right;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: 0.2s ease;
        }
        .fact-card:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 26px rgba(0,0,0,0.4), 0 0 14px var(--accent-soft);
            transform: translateY(-2px);
        }
        .fact-icon {
            font-size: 18px;
            flex-shrink: 0;
            background: var(--accent-soft);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fact-text { font-size: 14px; line-height: 1.6; color: #d3d7ea; font-family: 'Exo 2', sans-serif; }

        @media (max-width: 600px) {
            .periodic-table { grid-template-columns: repeat(18, 24px); gap: 1px; }
            .element { width: 24px; height: 24px; border-radius: 3px; border-width: 1px; }
            .empty { width: 24px; height: 24px; }
            .symbol { font-size: 8px; }
            .name { display: none; }
            .atomic-number { font-size: 5px; }

            .card-body { flex-direction: column; align-items: center; }
            .card-visual { flex: none; }
            .card-info { text-align: center; }
        }
    </style>
</head>
<body>
    <h1>Nawi Web ⚛️</h1>
    <p class="subtitle">Das interaktive Periodensystem</p>

    <div class="table-wrapper">
        <div class="periodic-table" id="periodic-table"></div>
    </div>

    <div id="info-card" class="info-card">
        <button class="close-btn" onclick="closeInfo()">✕</button>
        <h2 id="info-name"></h2>

        <div class="card-body">
            <div class="card-visual">
                <div class="element-image" id="element-image"></div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
                    <button class="atom-btn" onclick="toggleAtom()">⚛️ Atommodell</button>
                    <button class="atom-btn" id="facts-btn" onclick="openFactsPage()">🎓 Fakten</button>
                </div>

                <div class="atom-stage" id="atom-stage">
                    <canvas id="atom-canvas" width="170" height="170"></canvas>

                    <svg id="nucleus-line-svg">
                        <line id="nucleus-line" x1="85" y1="125" x2="95" y2="48" stroke="#22d3aa" stroke-width="1.4" />
                        <circle cx="85" cy="125" r="2.2" fill="#22d3aa" />
                        <circle id="nucleus-line-dot" cx="95" cy="48" r="3" fill="#22d3aa" />
                    </svg>

                    <div id="nucleus-tooltip">
                        <div class="tip-row"><span id="tip-protons"></span><span class="dot dot-proton"></span></div>
                        <div class="tip-row"><span id="tip-neutrons"></span><span class="dot dot-neutron"></span></div>
                    </div>
                </div>

                <button class="atom-btn" id="pause-btn" onclick="togglePause()" style="display:none;">⏸ Pause</button>

                <p class="hint">Tippe auf den Kern für Details</p>
            </div>

            <div class="card-info">
                <p id="info-symbol"></p>
                <p id="info-number"></p>
                <p id="info-mass"></p>
                <p id="info-protons"></p>
                <p id="info-neutrons"></p>
                <p id="info-electrons"></p>
                <p id="info-state"></p>
                <p id="info-shells"></p>
                <p id="info-found"></p>
                <p id="info-uses"></p>
            </div>
        </div>

        <div class="nav-buttons">
            <button onclick="prevElement()">← Zurück</button>
            <button onclick="nextElement()">Weiter →</button>
        </div>
    </div>

    </div>

    <div id="facts-page">
        <div class="facts-header">
            <button class="facts-back" onclick="closeFactsPage()">→ Zurück</button>
            <div class="facts-title">
                <span id="facts-symbol"></span>
                <h2 id="facts-name"></h2>
            </div>
        </div>
        <div class="facts-list" id="facts-list"></div>
    </div>

            { symbol: "As", name: "Arsen", number: 33, mass: 74.922, protons: 33, electrons: 33, state: "fest", shells: "2 / 8 / 18 / 5", found: "in Mineralien", uses: "Halbleiter", row: 4, col: 15, img: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Arsenic_%2833_As%29.jpg" },
            { symbol: "Se", name: "Selen", number: 34, mass: 78.960, protons: 34, electrons: 34, state: "fest", shells: "2 / 8 / 18 / 6", found: "in Mineralien", uses: "Glas", row: 4, col: 16, img: "https://upload.wikimedia.org/wikipedia/commons/7/7f/Selenium.jpg" },
            { symbol: "Br", name: "Brom", number: 35, mass: 79.904, protons: 35, electrons: 35, state: "flüssig", shells: "2 / 8 / 18 / 7", found: "im Meerwasser", uses: "Flammschutz", row: 4, col: 17, img: "https://upload.wikimedia.org/wikipedia/commons/8/87/Bromine-ampoule.jpg" },
            { symbol: "Kr", name: "Krypton", number: 36, mass: 83.798, protons: 36, electrons: 36, state: "gasförmig", shells: "2 / 8 / 18 / 8", found: "in der Luft", uses: "Laser", row: 4, col: 18, img: "https://upload.wikimedia.org/wikipedia/commons/9/9c/Krypton-glow.jpg" }
        ];

        const table = document.getElementById('periodic-table');
        const occupied = new Set(elementsData.map(el => `${el.row}-${el.col}`));

        for (let row = 1; row <= 4; row++) {
            for (let col = 1; col <= 18; col++) {
                const key = `${row}-${col}`;
                if (occupied.has(key)) {
                    const el = elementsData.find(e => e.row === row && e.col === col);
                    table.appendChild(createElement(el));
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    table.appendChild(empty);
                }
            }
        }

        function createElement(el) {
            const div = document.createElement('div');
            div.className = 'element';
            div.innerHTML = `<span class="atomic-number">${el.number}</span><span class="symbol">${el.symbol}</span><span class="name">${el.name}</span>`;
            div.onclick = () => showInfo(el);
            return div;
        }

        let currentIndex = 0;
        let animationId = null;
        let angleOffset = 0;
        let atomVisible = false; // persists across element navigation

        function neutronsOf(el) {
            return Math.max(0, Math.round(el.mass) - el.protons);
        }

        function shellArray(el) {
            return el.shells.split('/').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
        }

        function hideNucleusTooltip() {
            document.getElementById('nucleus-tooltip').classList.remove('active');
            document.getElementById('nucleus-line-svg').classList.remove('active');
        }

        function showInfo(el) {
            currentIndex = elementsData.indexOf(el);

            document.getElementById('info-name').textContent = el.name;
            document.getElementById('info-symbol').textContent = `Symbol: ${el.symbol}`;
            document.getElementById('info-number').textContent = `Ordnungszahl: ${el.number}`;
            document.getElementById('info-mass').textContent = `Atommasse: ${el.mass}`;
            document.getElementById('info-protons').textContent = `Protonen: ${el.protons}`;
            document.getElementById('info-neutrons').textContent = `Neutronen (ca.): ${neutronsOf(el)}`;
            document.getElementById('info-electrons').textContent = `Elektronen: ${el.electrons}`;
            document.getElementById('info-state').textContent = `Zustand: ${el.state}`;
            document.getElementById('info-shells').textContent = `Schalen: ${el.shells}`;
            document.getElementById('info-found').textContent = `Vorkommen: ${el.found}`;
            document.getElementById('info-uses').textContent = `Verwendung: ${el.uses}`;

            updateElementImage(el);

            document.getElementById('info-card').classList.add('active');

            // new element -> old nucleus tooltip content is stale, hide it
            hideNucleusTooltip();

            const stage = document.getElementById('atom-stage');
            if (atomVisible) {
                stage.classList.add('active');
                if (animationId) cancelAnimationFrame(animationId);
                drawAtom(document.getElementById('atom-canvas'));
            } else {
                stage.classList.remove('active');
                if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            }
        }

        function updateElementImage(el) {
            const box = document.getElementById('element-image');
            if (el.img && el.img.trim() !== '') {
                box.innerHTML = `<img src="${el.img}" alt="${el.name}">`;
            } else {
                box.innerHTML = `<span>${el.symbol}</span>`;
            }
        }

        function closeInfo() {
            document.getElementById('info-card').classList.remove('active');
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            document.getElementById('atom-stage').classList.remove('active');
            document.getElementById('pause-btn').style.display = 'none';
            hideNucleusTooltip();
            atomVisible = false;
            closeFactsPage();
        }

        function nextElement() {
            currentIndex = (currentIndex + 1) % elementsData.length;
            showInfo(elementsData[currentIndex]);
        }

        function prevElement() {
            currentIndex = (currentIndex - 1 + elementsData.length) % elementsData.length;
            showInfo(elementsData[currentIndex]);
        }

        let atomPaused = false;

        function togglePause() {
            atomPaused = !atomPaused;
            document.getElementById('pause-btn').textContent = atomPaused ? '▶ Fortsetzen' : '⏸ Pause';
        }

        function toggleAtom() {
            const stage = document.getElementById('atom-stage');
            const pauseBtn = document.getElementById('pause-btn');
            atomVisible = !atomVisible;
            if (atomVisible) {
                stage.classList.add('active');
                atomPaused = false;
                pauseBtn.textContent = '⏸ Pause';
                pauseBtn.style.display = 'inline-block';
                drawAtom(document.getElementById('atom-canvas'));
            } else {
                stage.classList.remove('active');
                pauseBtn.style.display = 'none';
                if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
                hideNucleusTooltip();
            }
        }

        let lastFrameTime = null;

        function drawAtom(canvas) {
            // HiDPI: render crisper on phone screens
            const dpr = window.devicePixelRatio || 1;
            const cssSize = 170;
            if (canvas.dataset.hidpiReady !== "1") {
                canvas.width = cssSize * dpr;
                canvas.height = cssSize * dpr;
                canvas.style.width = cssSize + "px";
                canvas.style.height = cssSize + "px";
                canvas.dataset.hidpiReady = "1";
            }

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const el = elementsData[currentIndex];
            const centerX = cssSize / 2;
            const centerY = cssSize / 2;
            const nucleusRadius = 11;

            const shellCounts = shellArray(el);
            const maxAvailableRadius = Math.min(centerX, centerY) - 8;
            const orbitCount = shellCounts.length || 1;
            const orbits = [];
            for (let i = 0; i < orbitCount; i++) {
                const spacing = (maxAvailableRadius - nucleusRadius - 10) / orbitCount;
                orbits.push(nucleusRadius + 10 + spacing * (i + 1));
            }

            lastFrameTime = null;
            let animClock = 0;
            let lastTsForClock = null;
            atomPaused = false;
            document.getElementById('pause-btn').textContent = '⏸ Pause';

            function draw(timestamp) {
                if (lastFrameTime === null) lastFrameTime = timestamp;
                lastFrameTime = timestamp;

                if (!atomPaused) {
                    if (lastTsForClock !== null) animClock += (timestamp - lastTsForClock);
                    lastTsForClock = timestamp;
                } else {
                    lastTsForClock = null;
                }

                ctx.clearRect(0, 0, cssSize, cssSize);

                // simple flat orbit rings (classic Bohr model)
                for (let i = 0; i < orbits.length; i++) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, orbits[i], 0, 2 * Math.PI);
                    ctx.strokeStyle = "rgba(43, 196, 160, 0.28)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // nucleus: single point with soft gradient for a bit of depth
                ctx.save();
                ctx.shadowColor = "rgba(43, 196, 160, 0.6)";
                ctx.shadowBlur = 9;
                const grad = ctx.createRadialGradient(
                    centerX - nucleusRadius * 0.3, centerY - nucleusRadius * 0.3, 0,
                    centerX, centerY, nucleusRadius
                );
                grad.addColorStop(0, "#a7f3e0");
                grad.addColorStop(0.55, "#2bc4a0");
                grad.addColorStop(1, "#127a5f");
                ctx.beginPath();
                ctx.arc(centerX, centerY, nucleusRadius, 0, 2 * Math.PI);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();

                ctx.beginPath();
                ctx.arc(centerX, centerY, nucleusRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.lineWidth = 1;
                ctx.stroke();

                // electrons: smooth, time-based motion around flat circular orbits
                let electronIndex = 0;
                for (let orbit = 0; orbit < orbits.length; orbit++) {
                    const countOnOrbit = shellCounts[orbit] || 0;
                    const speed = 0.0011 * (1 + 0.3 * (orbits.length - orbit));
                    const dir = orbit % 2 === 0 ? 1 : -1;

                    for (let i = 0; i < countOnOrbit; i++) {
                        if (electronIndex >= el.electrons) break;
                        const baseAngle = (2 * Math.PI * i) / countOnOrbit;
                        const angle = baseAngle + dir * speed * animClock;

                        const x = centerX + orbits[orbit] * Math.cos(angle);
                        const y = centerY + orbits[orbit] * Math.sin(angle);

                        ctx.save();
                        ctx.shadowColor = "rgba(86, 201, 232, 0.85)";
                        ctx.shadowBlur = 7;
                        ctx.beginPath();
                        ctx.arc(x, y, 3.2, 0, 2 * Math.PI);
                        ctx.fillStyle = "#bdeeff";
                        ctx.fill();
                        ctx.restore();
                        electronIndex++;
                    }
                }

                animationId = requestAnimationFrame(draw);
            }

            animationId = requestAnimationFrame(draw);
        }

        function openFactsPage() {
            const el = elementsData[currentIndex];
            document.getElementById('facts-symbol').textContent = el.symbol;
            document.getElementById('facts-name').textContent = el.name;

            const list = document.getElementById('facts-list');
            list.innerHTML = '';
            const facts = funFacts[el.symbol] || ["Für dieses Element sind noch keine Fakten hinterlegt."];
            facts.forEach(fact => {
                const card = document.createElement('div');
                card.className = 'fact-card';
                card.innerHTML = `<span class="fact-icon">💡</span><span class="fact-text">${fact}</span>`;
                list.appendChild(card);
            });

            document.getElementById('facts-page').classList.add('active');
        }

        function closeFactsPage() {
            document.getElementById('facts-page').classList.remove('active');
        }

        function handleNucleusTap(clientX, clientY, canvas) {
            const rect = canvas.getBoundingClientRect();
            // coordinates in CSS pixels (170x170), matching the space drawAtom() draws in
            const scaleX = 170 / rect.width;
            const scaleY = 170 / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            const centerX = 170 / 2;
            const centerY = 170 / 2;
            const dist = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
            const tolerance = 30; // forgiving hit area around the nucleus

            const tooltip = document.getElementById('nucleus-tooltip');
            const lineSvg = document.getElementById('nucleus-line-svg');

            if (dist <= tolerance) {
                const el = elementsData[currentIndex];
                const neutrons = neutronsOf(el);
                document.getElementById('tip-protons').textContent = `Protonen: ${el.protons}`;
                document.getElementById('tip-neutrons').textContent = `Neutronen (ca.): ${neutrons}`;

                const isActive = tooltip.classList.contains('active');
                if (isActive) {
                    tooltip.classList.remove('active');
                    lineSvg.classList.remove('active');
                } else {
                    tooltip.classList.add('active');
                    lineSvg.classList.add('active');
                }
            } else {
                tooltip.classList.remove('active');
                lineSvg.classList.remove('active');
            }
        }

        const atomCanvasEl = document.getElementById('atom-canvas');
        atomCanvasEl.addEventListener('click', function (e) {
            handleNucleusTap(e.clientX, e.clientY, e.currentTarget);
        });
        atomCanvasEl.addEventListener('touchstart', function (e) {
            if (e.touches && e.touches.length > 0) {
                e.preventDefault();
                const t = e.touches[0];
                handleNucleusTap(t.clientX, t.clientY, e.currentTarget);
            }
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeInfo();
        });

    </script>
